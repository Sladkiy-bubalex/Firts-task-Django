name: Test ci\cd

on:
    push:
        branches: [video]

jobs:
    testing:
        runs-on: ubuntu-latest
        env:
          USER_DB: ${{ secrets.USER_DB }}
          PASSWORD_DB: ${{ secrets.PASSWORD_DB }}
          NAME_DB: ${{ secrets.NAME_DB }}
          PORT_DB: ${{ secrets.PORT_DB }}
          HOTS_DB: ${{ secrets.HOST_DB }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
        services:
            postgres_main:
              image: postgres:latest
              env:
                POSTGRES_USER: ${{ env.USER_DB }}
                POSTGRES_PASSWORD: ${{ env.PASSWORD_DB }}
                POSTGRES_DB: ${{ env.NAME_DB }}
              ports:
                - 5432:5432
              options:
                --health-cmd pg_isready
                --health-interval 5s
                --health-timeout 5s
                --health-retries 5

        steps:
            - name: Проверка изменений
              uses: actions/checkout@v2

            - name: Установка Python
              uses: actions/setup-python@v5
              with:
                python-version: 3.13
            
            - name: Установка зависимостей
              run: pip install -r stocks_products/requirements.txt
            
            - name: Проверка линтером
              run: flake8 stocks_products --exclude migrations --ignore E501,F401

            - name: Тест
              run: python stocks_products/manage.py pytest
              env:
                USER_DB: ${{ env.USER_DB }}
                PASSWORD_DB: ${{ env.PASSWORD_DB }}
                NAME_DB: ${{ env.NAME_DB }}
                PORT_DB: ${{ env.PORT_DB }}
                HOST_DB: ${{ env.HOST_DB }}
    deploy:
      runs-on: ubuntu-latest
      needs: testing
      steps:
        - name: deploy
          uses: appleboy/ssh-action@master
          env:
            DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
            DEPLOY_USERNAME: ${{ env.DEPLOY_USERNAME }}
          with:
            host: DEPLOY_HOST
            username: DEPLOY_USERNAME